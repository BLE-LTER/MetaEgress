name: testthat

on:
  push:
    branches: [main, add_unit_test]
  pull_request:
    branches: [main]

jobs:
  testthat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat

      - name: Run unit tests
        run: Rscript -e 'devtools::test()'